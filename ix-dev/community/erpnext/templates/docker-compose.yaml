{% set tpl = ix_lib.base.render.Render(values) %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set db = tpl.deps.mariadb(values.consts.db_container_name, 'mariadb_image', {
  'user': 'frappe_bootstrap', 'password': values.erpnext.db_password,
  'database': 'frappe_bootstrap', 'root_password': values.erpnext.db_password,
  'auto_upgrade': false, 'volume': values.storage.db_data
}, perms) %}
{% do db.container.environment.add_env('MARIADB_ROOT_HOST', '%') %}
{% do db.container.set_command(['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--skip-character-set-client-handshake']) %}
{% do db.container.healthcheck.set_start_period(60) %}
{% do db.container.healthcheck.set_retries(30) %}

{% set cache = tpl.add_container(values.consts.redis_cache_container_name, 'redis_image') %}
{% do cache.set_user(1000, 1000) %}
{% do cache.set_command(['redis-server', '--save', '', '--appendonly', 'no']) %}
{% do cache.healthcheck.set_custom_test(['CMD', 'redis-cli', 'ping']) %}
{% do cache.deploy.resources.set_profile('low') %}

{% set queue = tpl.add_container(values.consts.redis_queue_container_name, 'redis_image') %}
{% do queue.set_user(1000, 1000) %}
{% do queue.set_command(['redis-server', '--appendonly', 'yes']) %}
{% do queue.add_storage('/data', values.storage.queue_data) %}
{% do queue.healthcheck.set_custom_test(['CMD', 'redis-cli', 'ping']) %}
{% do queue.deploy.resources.set_profile('low') %}
{% do perms.add_or_skip_action('queue_data', values.storage.queue_data, {'uid': 1000, 'gid': 1000, 'mode': 'check'}) %}
{% for key in ['sites', 'logs'] %}
  {% do perms.add_or_skip_action(key, values.storage[key], {'uid': 1000, 'gid': 1000, 'mode': 'check'}) %}
{% endfor %}

{# Connection settings follow frappe/frappe_docker compose.yaml. #}
{% set configurator = tpl.add_container(values.consts.configurator_container_name, 'image') %}
{% do configurator.set_user(1000, 1000) %}
{% do configurator.restart.set_policy('no') %}
{% do configurator.healthcheck.disable() %}
{% do configurator.set_entrypoint(['bash', '-ec']) %}
{% set configure %}
ls -1 apps > sites/apps.txt
bench set-config -g db_host "$DB_HOST"
bench set-config -gp db_port "$DB_PORT"
bench set-config -g redis_cache "redis://$REDIS_CACHE"
bench set-config -g redis_queue "redis://$REDIS_QUEUE"
bench set-config -g redis_socketio "redis://$REDIS_QUEUE"
bench set-config -gp socketio_port "$SOCKETIO_PORT"
bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell
{% endset %}
{% do configurator.set_command([configure]) %}
{% for key, value in {'DB_HOST':'db', 'DB_PORT':'3306', 'REDIS_CACHE':'redis-cache:6379', 'REDIS_QUEUE':'redis-queue:6379', 'SOCKETIO_PORT':'9000'}.items() %}
  {% do configurator.environment.add_env(key, value) %}
{% endfor %}
{% do configurator.add_storage(values.consts.sites_path, values.storage.sites) %}
{% do configurator.add_storage(values.consts.logs_path, values.storage.logs) %}
{% for name in [values.consts.db_container_name, values.consts.redis_cache_container_name, values.consts.redis_queue_container_name] %}
  {% do configurator.depends.add_dependency(name, 'service_healthy') %}
{% endfor %}

{% set runtime = {} %}
{% for name in [values.consts.backend_container_name, values.consts.websocket_container_name, values.consts.queue_short_container_name, values.consts.queue_long_container_name, values.consts.scheduler_container_name, values.consts.frontend_container_name] %}
  {% set c = tpl.add_container(name, 'image') %}
  {% do runtime.update({name: c}) %}
  {% do c.set_user(1000, 1000) %}
  {% do c.add_storage(values.consts.sites_path, values.storage.sites) %}
  {% do c.add_storage(values.consts.logs_path, values.storage.logs) %}
  {% do c.depends.add_dependency(values.consts.configurator_container_name, 'service_completed_successfully') %}
  {% if name != values.consts.frontend_container_name %}
    {% do c.healthcheck.disable() %}
  {% endif %}
{% endfor %}
{% do runtime[values.consts.backend_container_name].set_command(['start.sh']) %}
{% do runtime[values.consts.queue_short_container_name].set_command(['bench', 'worker', '--queue', 'short,default']) %}
{% do runtime[values.consts.queue_long_container_name].set_command(['bench', 'worker', '--queue', 'long,default,short']) %}
{% do runtime[values.consts.scheduler_container_name].set_command(['bench', 'schedule']) %}
{% do runtime[values.consts.websocket_container_name].set_command(['node', '/home/frappe/frappe-bench/apps/frappe/socketio.js']) %}
{% set frontend = runtime[values.consts.frontend_container_name] %}
{# The image makes nginx config/cache/pid paths writable by group 0. #}
{% do frontend.add_group(0) %}
{% do frontend.set_command(['nginx-entrypoint.sh']) %}
{% for key, value in {'BACKEND': 'backend:8000', 'SOCKETIO': 'websocket:9000', 'FRAPPE_SITE_NAME_HEADER': values.erpnext.site_name, 'NGINX_LISTEN_PORT': '8080', 'UPSTREAM_REAL_IP_ADDRESS': '127.0.0.1', 'UPSTREAM_REAL_IP_HEADER': 'X-Forwarded-For', 'UPSTREAM_REAL_IP_RECURSIVE': 'off', 'PROXY_READ_TIMEOUT': '120', 'CLIENT_MAX_BODY_SIZE': '50m'}.items() %}
  {% do frontend.environment.add_env(key, value) %}
{% endfor %}
{% do frontend.add_port(values.network.web_port, {'container_port': 8080}) %}
{% for name in [values.consts.backend_container_name, values.consts.websocket_container_name] %}
  {% do frontend.depends.add_dependency(name, 'service_started') %}
{% endfor %}
{# Probe the listener before a site exists; HTTP 404 during manual setup is expected. #}
{% do frontend.healthcheck.set_test('tcp', {'port': 8080}) %}
{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% for c in [configurator, db.container, queue] %}
    {% do c.depends.add_dependency(values.consts.perms_container_name, 'service_completed_successfully') %}
  {% endfor %}
{% endif %}
{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body('Manual setup required: create the site from the backend shell with the upstream bench new-site command in the README. A 404 before site creation is expected. Backup, migration and restore are operator-managed upstream operations. Do not reuse storage from the former guarded prototype. Resource limits apply per container.') %}
{{ tpl.render() | tojson }}
